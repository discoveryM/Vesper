name: Build Vesper APK & Get SHA-1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Print Package Name & SHA-1 Fingerprint
        run: gradle signingReport

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Debug Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Debug-Keystore
          path: debug.keystore
          
